[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "norm-route"
version = "0.0.0"
description = "Few-normal-shot industrial anomaly inspection Agent research."
readme = "AGENTS.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"
